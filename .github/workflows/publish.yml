name: publish NuGet package

on:
  release:
    types: [published]

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Kampute.DocToolkit.sln

    - name: Build solution
      run: dotnet build Kampute.DocToolkit.sln --no-restore --configuration Release

    - name: Test solution
      run: dotnet test Kampute.DocToolkit.sln --no-restore --no-build --configuration Release --verbosity minimal

    - name: Pack signed package
      shell: bash
      env:
        SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      run: |
        set -euo pipefail

        if [[ -z "$SIGNING_KEY_BASE64" ]]; then
          echo "The SIGNING_KEY_BASE64 environment secret is not configured." >&2
          exit 1
        fi

        signing_key="$RUNNER_TEMP/Kampute.DocToolkit.snk"
        trap 'rm -f "$signing_key"' EXIT
        umask 077
        printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$signing_key"

        dotnet pack src/Kampute.DocToolkit.csproj \
          --no-restore \
          --configuration Release \
          --output artifacts \
          -p:SignAssembly=true \
          -p:AssemblyOriginatorKeyFile="$signing_key"

        package_version="${GITHUB_REF_NAME#v}"
        expected_package="artifacts/Kampute.DocToolkit.${package_version}.nupkg"
        if [[ ! -f "$expected_package" ]]; then
          echo "Expected $expected_package for release tag $GITHUB_REF_NAME." >&2
          exit 1
        fi

    - name: Log in to NuGet with OIDC
      id: nuget-login
      uses: NuGet/login@v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish package
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: >-
        dotnet nuget push artifacts/*.nupkg
        --api-key "$NUGET_API_KEY"
        --source https://api.nuget.org/v3/index.json
